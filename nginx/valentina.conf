# Snippet di configurazione Nginx per valentinaandolfi.it
# Copiare/incollare nella server block esistente in /etc/nginx/sites-available/valentina
# (oppure usare come file separato da includere).

# ---------- Admin CMS ----------
# Servito come SPA sotto /gestione-contenuti-vra2024
location /gestione-contenuti-vra2024 {
    alias /var/www/valentina/admin/dist;
    index index.html;
    try_files $uri $uri/ /gestione-contenuti-vra2024/index.html;

    # Non indicizzare
    add_header X-Robots-Tag "noindex, nofollow" always;
}

# ---------- API backend ----------
location /api {
    proxy_pass http://localhost:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Upload immagini fino a 10 MB
    client_max_body_size 10M;
    proxy_read_timeout 60s;
}

# ---------- Sitemap dinamico ----------
location = /sitemap.xml {
    proxy_pass http://localhost:3001/sitemap.xml;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# ---------- Immagini caricate ----------
# Nginx serve direttamente i file statici (più veloce del proxy Node)
location /uploads {
    alias /var/www/valentina/backend/uploads;
    access_log off;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options nosniff;

    # Nega l'esecuzione di script accidentalmente caricati
    location ~ \.(php|pl|py|jsp|asp|sh|cgi)$ {
        deny all;
    }
}
